[package]
name = "annuncia"
version = "0.1.0"
edition = "2024"
description = "A native macOS screen recorder with voiceover and a camera bubble, built with GPUI"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
chrono = "0.4"
core-foundation = "0.10"
core-video = "0.4.3"
dirs = "7"
global-hotkey = "0.9.0"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-graphics", "objc2-core-media"] }
objc2-core-media = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-image = { version = "0.3", features = ["objc2-core-video"] }
objc2-core-video = { version = "0.3", features = ["objc2-io-surface"] }
objc2-foundation = "0.3"
# Writing library thumbnails.
objc2-image-io = { version = "0.3", features = ["objc2-core-graphics"] }
objc2-io-surface = { version = "0.3", features = ["objc2-core-foundation"] }
objc2-quartz-core = "0.3"
# Person segmentation for the pop-out camera bubble.
objc2-vision = { version = "0.3", features = ["objc2-core-video", "objc2-image-io"] }
dispatch2 = "0.3"
block2 = "0.6"
screencapturekit = { version = "11.1.1", features = ["macos_15_0"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smol = "2"
# Local speech-to-text (ggml, Metal on Apple silicon).
transcribe-cpp = { git = "https://github.com/anomalyco/transcribe.cpp", rev = "7045d1c0fe7cee37747b2792977421d435e75fca" }
tray-icon = "0.26.1"
