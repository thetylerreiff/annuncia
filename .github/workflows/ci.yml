name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings
      # Builds the bundle with Sparkle inside, signed ad hoc: no secrets here, so forks can run it.
      - run: scripts/bundle.sh
      - run: scripts/dmg.sh target/release/Annuncia.app target/release/Annuncia.dmg
